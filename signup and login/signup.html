<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <h1>SIGNUP FORM</h1>

    <form action="" id="signupform">
        <label for="">Enter name</label><br>
        <span style="color: green;">Name length must be greater than five</span><br>
        <input type="text" id="username" placeholder="Enter Your name "><br>
        <label for="">Enter Email</label><br>
        <input type="text" id="email" placeholder="Enter Email"><br>
        <label for="">Enter Password</label><br>
        <input type="text" id="password" placeholder="Enter Password"><br>
        <label for="">Confirm Password</label><br>
        <input type="text" id="cpassword" placeholder="Confirm Password"><br>
        <button type="submit">Signup</button>
    </form>

    <script>
        $(document).ready(function () {

            function checkname() {
                var value = $("#username").val();
                var regexp = /^[A-Za-z][A-Za-z0-9_]{5,10}$/;
                if (!regexp.test(value)) {
                    alert("Name Must be Greater then 5")
                    return false
                }

                return true
            }

            function checkemail() {

                var emailvalue = $("#email").val();

                console.log(emailvalue)

                var reg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!reg.test(emailvalue)) {
                    alert("Enter Valid Email")
                    return false
                }
                return true

            }


            function checkpassword() {
                var passwordvalue = $("#password").val()
                var cpassword = $("#cpassword").val()
                var passreg = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[\d])(?=.*[A-Za-z0-9]).{8,}$/;
                if (!passreg.test(passwordvalue)) {
                    alert("password is  not  strong")
                    return false;
                }
                if (cpassword !== passwordvalue) {
                    alert("confirm password is not match wit password")
                    return false
                }
                return true;
            }
            $("#signupform").submit(function (e) {
                e.preventDefault()
                // // checkname()
                // // checkemail()
                // checkpassword()
                if (checkname() && checkemail() && checkpassword()) {
                    alert("Signup sucessfull")
                }

            })

        })




    </script>
</body>

</html>
